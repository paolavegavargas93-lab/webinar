<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Master Class · Cocrear ecosistemas educativos con IAG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070714; --bg2:#120A2E; --panel:rgba(18,10,46,.62);
  --cyan:#00e5ff; --magenta:#ff2d95; --violet:#9d6bff; --gold:#ffd166;
  --ink:#eaf6ff; --muted:#9aa6d6; --line:rgba(157,107,255,.28);
  --ok:#3ee6a0;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Rajdhani',system-ui,sans-serif;
  background:var(--bg); color:var(--ink);
  overflow:hidden; position:fixed; inset:0;
  -webkit-tap-highlight-color:transparent;
}
/* ---------- Fondo animado ---------- */
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
.bg-grid{
  position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.35;
  background-image:
    linear-gradient(rgba(0,229,255,.06) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,45,149,.06) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(circle at 50% 40%,#000 0%,transparent 78%);
}
.bg-glow{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
   radial-gradient(60% 50% at 15% 15%,rgba(255,45,149,.16),transparent 60%),
   radial-gradient(60% 50% at 85% 85%,rgba(0,229,255,.16),transparent 60%),
   radial-gradient(50% 40% at 50% 50%,rgba(157,107,255,.10),transparent 70%);
}
/* ---------- Barra superior ---------- */
.topbar{position:fixed;top:0;left:0;right:0;z-index:30;
  display:flex;align-items:center;gap:12px;padding:10px 16px;
  background:linear-gradient(180deg,rgba(7,7,20,.92),rgba(7,7,20,0));}
.brand{display:flex;align-items:center;gap:10px;font-family:'Orbitron';font-weight:900;
  letter-spacing:1px;font-size:14px}
.brand .dot{width:12px;height:12px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,#fff,var(--cyan));
  box-shadow:0 0 14px var(--cyan)}
.brand b{background:linear-gradient(90deg,var(--cyan),var(--magenta));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.spacer{flex:1}
.top-btn{cursor:pointer;border:1px solid var(--line);background:var(--panel);
  color:var(--ink);font-family:'Orbitron';font-weight:700;font-size:12px;
  padding:8px 12px;border-radius:10px;display:flex;align-items:center;gap:8px;
  transition:.18s;backdrop-filter:blur(6px)}
.top-btn:hover{border-color:var(--cyan);box-shadow:0 0 16px rgba(0,229,255,.35);transform:translateY(-1px)}
.live-btn{border-color:var(--magenta);color:#fff;
  background:linear-gradient(90deg,rgba(255,45,149,.85),rgba(157,107,255,.85))}
.live-btn .rec{width:9px;height:9px;border-radius:50%;background:#fff;
  box-shadow:0 0 10px #fff;animation:blink 1.1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
/* barra de progreso */
.progress{position:fixed;top:0;left:0;height:3px;z-index:31;
  background:linear-gradient(90deg,var(--cyan),var(--magenta),var(--violet));
  box-shadow:0 0 12px var(--cyan);transition:width .35s ease;width:0}
/* ---------- Deck ---------- */
.deck{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center}
.slide{position:absolute;inset:0;display:none;flex-direction:column;
  padding:64px 22px 92px;overflow-y:auto;overflow-x:hidden;
  animation:fade .5s ease;scrollbar-width:thin;scrollbar-color:var(--violet) transparent}
.slide::-webkit-scrollbar{width:8px}
.slide::-webkit-scrollbar-thumb{background:var(--violet);border-radius:8px}
.slide.active{display:flex}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.wrap{width:100%;max-width:1080px;margin:auto}
/* etiquetas de fase */
.tag{display:inline-flex;align-items:center;gap:8px;font-family:'Orbitron';font-weight:700;
  font-size:12px;letter-spacing:1.5px;text-transform:uppercase;
  padding:6px 14px;border-radius:999px;border:1px solid var(--line);
  background:rgba(157,107,255,.12);color:var(--violet);margin-bottom:16px}
.tag.cyan{color:var(--cyan);border-color:rgba(0,229,255,.4);background:rgba(0,229,255,.08)}
.tag.mag{color:var(--magenta);border-color:rgba(255,45,149,.4);background:rgba(255,45,149,.08)}
.tag.gold{color:var(--gold);border-color:rgba(255,209,102,.4);background:rgba(255,209,102,.1)}
.tag .mins{font-family:'Rajdhani';font-weight:700;opacity:.85}
h1.title{font-family:'Orbitron';font-weight:900;line-height:1.05;
  font-size:clamp(28px,6vw,60px);letter-spacing:.5px;margin-bottom:14px}
.grad{background:linear-gradient(100deg,var(--cyan),var(--violet) 55%,var(--magenta));
  -webkit-background-clip:text;background-clip:text;color:transparent}
h2.title{font-family:'Orbitron';font-weight:800;line-height:1.08;
  font-size:clamp(24px,4.6vw,42px);margin-bottom:12px}
.lead{font-size:clamp(16px,2.2vw,21px);color:#d6e2ff;line-height:1.55;max-width:820px}
.lead b{color:var(--cyan)}
.muted{color:var(--muted)}
.divider{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:22px 0}
/* tarjetas */
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;
  padding:18px;backdrop-filter:blur(8px)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:820px){.grid2,.grid3{grid-template-columns:1fr}}
/* ponentes */
.speaker{display:flex;flex-direction:column;gap:6px;text-align:left}
.speaker .av{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;
  justify-content:center;font-family:'Orbitron';font-weight:900;font-size:20px;color:#07030f;
  background:linear-gradient(135deg,var(--cyan),var(--violet))}
.speaker.s2 .av{background:linear-gradient(135deg,var(--violet),var(--magenta))}
.speaker.s3 .av{background:linear-gradient(135deg,var(--magenta),var(--gold))}
.speaker .nm{font-family:'Orbitron';font-weight:700;font-size:16px}
.speaker .rl{color:var(--muted);font-size:15px;line-height:1.35}
/* recurso: tarjeta-enlace completa */
.res{margin-top:16px;display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink);
  border:1px solid var(--line);border-radius:16px;padding:16px 16px;cursor:pointer;
  background:linear-gradient(90deg,rgba(157,107,255,.12),rgba(0,229,255,.05));
  transition:.18s;position:relative;overflow:hidden}
.res::after{content:"";position:absolute;inset:0;border-radius:16px;pointer-events:none;
  box-shadow:inset 0 0 0 1px transparent;transition:.18s}
.res:hover{transform:translateY(-2px);border-color:var(--cyan);
  box-shadow:0 8px 30px rgba(0,229,255,.22)}
.res:hover .res-open{box-shadow:0 0 26px rgba(0,229,255,.6);transform:translateX(2px)}
.res-ic{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:24px;background:rgba(0,229,255,.12);border:1px solid var(--line);flex:0 0 auto}
.res-meta{flex:1;min-width:0}
.res-title{font-family:'Orbitron';font-weight:700;font-size:15px;line-height:1.25;
  overflow:hidden;text-overflow:ellipsis}
.res-url{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.res-open{flex:0 0 auto;font-family:'Orbitron';font-weight:700;font-size:13px;color:#07030f;
  background:linear-gradient(90deg,var(--cyan),var(--violet));
  padding:11px 16px;border-radius:11px;display:flex;align-items:center;gap:7px;
  box-shadow:0 0 16px rgba(0,229,255,.3);transition:.18s;white-space:nowrap}
/* lista de pasos */
.steps{list-style:none;display:flex;flex-direction:column;gap:10px;margin-top:8px}
.steps li{display:flex;gap:12px;align-items:flex-start;font-size:16px;line-height:1.45}
.steps .n{flex:0 0 auto;width:26px;height:26px;border-radius:8px;font-family:'Orbitron';
  font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;
  background:rgba(0,229,255,.14);color:var(--cyan);border:1px solid rgba(0,229,255,.35)}
.pill{display:inline-block;font-family:'Orbitron';font-size:11px;font-weight:700;letter-spacing:1px;
  padding:4px 10px;border-radius:999px;background:rgba(255,209,102,.12);color:var(--gold);
  border:1px solid rgba(255,209,102,.35);text-transform:uppercase}
.hint{margin-top:16px;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px}
.kbd{font-family:'Orbitron';font-size:11px;border:1px solid var(--line);border-radius:6px;
  padding:2px 7px;background:rgba(157,107,255,.1);color:var(--ink)}
/* ---------- Controles de navegación ---------- */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;align-items:center;gap:12px;
  padding:12px 16px;background:linear-gradient(0deg,rgba(7,7,20,.94),rgba(7,7,20,0))}
.nav-btn{cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  font-family:'Orbitron';font-weight:700;font-size:13px;padding:11px 18px;border-radius:12px;
  display:flex;align-items:center;gap:8px;transition:.18s;backdrop-filter:blur(6px)}
.nav-btn:hover:not(:disabled){border-color:var(--cyan);box-shadow:0 0 16px rgba(0,229,255,.35);transform:translateY(-1px)}
.nav-btn:disabled{opacity:.35;cursor:not-allowed}
.nav-btn.primary{color:#07030f;border:none;background:linear-gradient(90deg,var(--cyan),var(--magenta));
  box-shadow:0 0 18px rgba(255,45,149,.35)}
.counter{flex:1;text-align:center;font-family:'Orbitron';font-weight:700;font-size:13px;color:var(--muted)}
.counter b{color:var(--ink)}
/* ---------- Índice / menú ---------- */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(4,4,12,.72);backdrop-filter:blur(6px);
  display:none;opacity:0;transition:opacity .25s}
.overlay.open{display:block;opacity:1}
.menu{position:absolute;top:0;left:0;bottom:0;width:min(420px,86vw);
  background:linear-gradient(180deg,#0c0a24,#0a0818);border-right:1px solid var(--line);
  padding:18px 14px;overflow-y:auto;transform:translateX(-102%);transition:transform .3s cubic-bezier(.2,.9,.2,1);
  box-shadow:24px 0 60px rgba(0,0,0,.6)}
.overlay.open .menu{transform:none}
.menu h3{font-family:'Orbitron';font-weight:900;font-size:16px;margin:6px 8px 14px;
  display:flex;align-items:center;gap:10px}
.menu-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;cursor:pointer;
  border:1px solid transparent;transition:.15s;margin-bottom:4px}
.menu-item:hover{background:rgba(157,107,255,.12);border-color:var(--line)}
.menu-item.active{background:linear-gradient(90deg,rgba(0,229,255,.14),rgba(255,45,149,.1));
  border-color:var(--cyan)}
.menu-item .idx{flex:0 0 auto;width:30px;height:30px;border-radius:8px;font-family:'Orbitron';
  font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;
  background:rgba(7,7,20,.7);color:var(--violet);border:1px solid var(--line)}
.menu-item.active .idx{background:linear-gradient(135deg,var(--cyan),var(--magenta));color:#07030f;border:none}
.menu-item .lbl{font-family:'Rajdhani';font-weight:600;font-size:15px;line-height:1.25}
.menu-item .lbl small{display:block;color:var(--muted);font-size:12px;font-weight:500}
.menu-close{position:absolute;top:16px;right:16px;cursor:pointer;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);width:38px;height:38px;border-radius:10px;font-size:18px}
/* toast */
.toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%) translateY(20px);z-index:60;
  background:rgba(12,10,36,.96);border:1px solid var(--cyan);border-radius:12px;padding:10px 16px;
  font-size:14px;opacity:0;pointer-events:none;transition:.3s;box-shadow:0 0 24px rgba(0,229,255,.3)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:560px){
  .slide{padding:60px 14px 88px}
  .res-url{display:none}
  .nav-btn{padding:11px 14px}
  .brand span.full{display:none}
}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="bg-grid"></div>
<div class="bg-glow"></div>
<div class="progress" id="progress"></div>

<div class="topbar">
  <div class="brand"><span class="dot"></span><b>MISAELVERSE</b><span class="full muted">· Master Class</span></div>
  <div class="spacer"></div>
  <a id="liveBtn" class="top-btn live-btn" href="#" target="_blank" rel="noopener" style="display:none">
    <span class="rec"></span> EN VIVO</a>
  <button class="top-btn" id="menuBtn">☰ ÍNDICE</button>
</div>

<div class="deck" id="deck"></div>

<div class="nav">
  <button class="nav-btn" id="prevBtn">◀ Anterior</button>
  <div class="counter"><b id="cur">1</b> / <span id="tot">1</span></div>
  <button class="nav-btn primary" id="nextBtn">Siguiente ▶</button>
</div>

<div class="overlay" id="overlay">
  <nav class="menu" id="menu">
    <button class="menu-close" id="menuClose">✕</button>
    <h3><span class="dot" style="width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,var(--cyan));box-shadow:0 0 12px var(--cyan)"></span> Ruta de la clase</h3>
    <div id="menuList"></div>
  </nav>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   CONFIGURA AQUÍ EL ENLACE DE LA TRANSMISIÓN EN VIVO (YouTube)
   Pega la URL entre comillas. Si lo dejas vacío, el botón se oculta.
============================================================ */
const LIVE_YOUTUBE_URL = "";

/* ---------- utilidades ---------- */
const esc = s => (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const host = u => { try { return new URL(u).hostname.replace(/^www\./,""); } catch(e){ return u; } };

/* recurso: tarjeta-enlace completa que abre el recurso en una pestaña nueva */
function resource(r){
  return `
  <a class="res" href="${esc(r.url)}" target="_blank" rel="noopener" data-res>
    <div class="res-ic">${r.icon||"🎮"}</div>
    <div class="res-meta">
      <div class="res-title">${esc(r.title)}</div>
      <div class="res-url">${esc(host(r.url))}</div>
    </div>
    <span class="res-open">Abrir ↗</span>
  </a>`;
}

/* ---------- CONTENIDO: diapositivas ---------- */
const R = {
  misael:{title:"El Misaelverse · Metaverso educativo", url:"https://misaelpastranaied.com/misaelverse-metaverso", icon:"🌌"},
  chismo:{title:"Chismógrafo Gamer · Encuesta inicial", url:"https://paolavegavargas93-lab.github.io/chismografowebinar/", icon:"🗳️"},
  chismoIA:{title:"Análisis con IA del Chismógrafo", url:"https://claude.ai/public/artifacts/28b5185f-ebbe-4c4e-ae2f-f5f8654396c0", icon:"🤖"},
  prompt1:{title:"Prompt Maestro · Constructor", url:"https://claude.ai/public/artifacts/770a7e59-abe4-4496-9958-29e4829a6f89", icon:"🧩"},
  prompt2:{title:"Prompt Maestro · Variante", url:"https://claude.ai/public/artifacts/ea8b7a06-ca6b-4788-852e-28103a7d20fe", icon:"🧩"},
  v1:{title:"Versión 1 · Videojuego genérico", url:"https://claude.ai/public/artifacts/43675e79-d1d0-4469-85c0-1c82e91b7d0e", icon:"🕹️"},
  padlet:{title:"Muro colaborativo · Padlet del webinar", url:"https://padlet.com/paolavegavargas93/mi-primer-videogame-con-ia-webinar-s02366gfg08akkqne382", icon:"🧱"},
  v2:{title:"Versión 2 · Personalizando", url:"https://claude.ai/public/artifacts/9e1c0977-0797-4c6d-b709-69f606dcf79a", icon:"🎨"},
  v3:{title:"Versión 3 · Tildes VRS3", url:"https://paolavegavargas93-lab.github.io/tildesvrs3/", icon:"✨"},
  v4:{title:"Versión 4 · Tildes VRS4", url:"https://paolavegavargas93-lab.github.io/tildesvrs4/", icon:"🔧"},
  v5:{title:"Versión 5 · Tildes VRS5 (final)", url:"https://paolavegavargas93-lab.github.io/tildesvrs5/", icon:"🏆"},
};

const slides = [
  { menu:"Portada", sub:"Bienvenida",
    html:`<div class="wrap" style="text-align:center">
      <div class="tag cyan" style="margin:0 auto 18px">Webinar · 3 de septiembre</div>
      <div style="font-family:'Orbitron';font-weight:900;letter-spacing:6px;font-size:clamp(14px,3vw,20px);color:var(--muted);margin-bottom:6px">MASTER CLASS</div>
      <h1 class="title grad" style="max-width:900px;margin:0 auto 18px">Cocrear ecosistemas educativos con IAG</h1>
      <p class="lead" style="margin:0 auto 8px;text-align:center">Diseño y programación de <b>videojuegos educativos personalizados</b> — de la idea a un juego funcional en HTML, listo para el aula incluso sin conexión.</p>
      <div class="hint" style="justify-content:center;margin-top:22px">
        <span class="kbd">◀</span><span class="kbd">▶</span> navega &nbsp;·&nbsp; <span class="kbd">☰</span> abre el índice para adelantarte
      </div>
    </div>`},

  { menu:"Ponentes", sub:"Quiénes guían",
    html:`<div class="wrap">
      <div class="tag">Ponentes</div>
      <h2 class="title">Quiénes guían esta clase</h2>
      <div class="grid3" style="margin-top:22px">
        <div class="card speaker s1">
          <div class="av">JV</div>
          <div class="nm">José Alexander Villa Díaz</div>
          <div class="rl">Doctor en Educación · Universidad Santo Tomás de Colombia</div>
        </div>
        <div class="card speaker s2">
          <div class="av">JM</div>
          <div class="nm">Juan David Moreno Jiménez</div>
          <div class="rl">Magíster en Didáctica de la Lengua y la Literatura · Universidad Internacional de La Rioja</div>
        </div>
        <div class="card speaker s3">
          <div class="av">NV</div>
          <div class="nm">Nubia Paola Vega Vargas</div>
          <div class="rl">Doctoranda en Ciencias de la Educación · Universidad Cuauhtémoc</div>
        </div>
      </div>
    </div>`},

  { menu:"Introducción", sub:"De qué trata",
    html:`<div class="wrap">
      <div class="tag cyan">Introducción</div>
      <h2 class="title">Programación <span class="grad">low-code</span> de videojuegos educativos</h2>
      <p class="lead">En esta clase nos adentraremos en la creación de videojuegos educativos personalizados. Juntos recrearemos el proceso completo —desde la idea inicial hasta un <b>videojuego funcional en HTML</b>, listo para usarse en el aula incluso sin conexión a internet.</p>
      <div class="divider"></div>
      <ul class="steps">
        <li><span class="n">1</span><div>Recogemos los <b>intereses</b> de estudiantes y las <b>necesidades</b> de los docentes.</div></li>
        <li><span class="n">2</span><div>Construimos un <b>prompt maestro</b> que los integra.</div></li>
        <li><span class="n">3</span><div>Generamos, <b>personalizamos y refinamos</b> el juego con IA.</div></li>
        <li><span class="n">4</span><div>Lo <b>publicamos</b> con un enlace web listo para compartir.</div></li>
      </ul>
    </div>`},

  { menu:"El Misaelverse", sub:"El ecosistema",
    html:`<div class="wrap">
      <div class="tag mag">Reconocimiento</div>
      <h2 class="title">El <span class="grad">Misaelverse</span></h2>
      <p class="lead">Ecosistema educativo gamificado creado por estudiantes y docentes del <b>Colegio Misael Pastrana Borrero IED</b> (localidad 18, Rafael Uribe Uribe, Bogotá).</p>
      ${resource(R.misael)}
    </div>`},

  { menu:"Fase 1", sub:"Chismógrafo Gamer",
    html:`<div class="wrap">
      <div class="tag gold">Fase 1 <span class="mins">· ~4 min</span></div>
      <h2 class="title">Chismógrafo Gamer</h2>
      <p class="lead">Resignificamos la práctica de <b>"chismear"</b> y la convertimos en un instrumento para recolectar datos sobre los intereses de los estudiantes, analizados luego mediante IA.</p>
      <div class="hint" style="margin-top:18px"><span class="pill">Siguiente</span> lo pondremos en marcha con los docentes conectados.</div>
    </div>`},

  { menu:"Momento 1", sub:"Encuesta inicial",
    html:`<div class="wrap">
      <div class="tag cyan">Momento 1 · Interacción</div>
      <h2 class="title">Encuesta inicial</h2>
      <p class="lead">Indagamos con los asistentes: <b>¿qué videojuego te gustaría crear?</b> Responde tú también en el chismógrafo y observa cómo la IA analiza las respuestas.</p>
      <div class="grid2" style="margin-top:6px">
        <div>${resource(R.chismo)}</div>
        <div>${resource(R.chismoIA)}</div>
      </div>
    </div>`},

  { menu:"Fase 2", sub:"Necesidades docentes",
    html:`<div class="wrap">

/* ---------- render ---------- */
const deck = document.getElementById('deck');
const menuList = document.getElementById('menuList');
slides.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className='slide'; el.dataset.i=i; el.innerHTML=s.html;
  deck.appendChild(el);
  const mi = document.createElement('div');
  mi.className='menu-item'; mi.dataset.i=i;
  mi.innerHTML=`<div class="idx">${i+1}</div><div class="lbl">${esc(s.menu)}<small>${esc(s.sub||"")}</small></div>`;
  mi.addEventListener('click',()=>{ go(i); closeMenu(); });
  menuList.appendChild(mi);
});

const slideEls = [...deck.querySelectorAll('.slide')];
const menuItems = [...menuList.querySelectorAll('.menu-item')];
const total = slides.length;
document.getElementById('tot').textContent = total;
let idx = 0;

function go(n){
  n = Math.max(0, Math.min(total-1, n));
  slideEls[idx].classList.remove('active');
  menuItems[idx].classList.remove('active');
  idx = n;
  const cur = slideEls[idx];
  cur.classList.add('active');
  cur.scrollTop = 0;
  menuItems[idx].classList.add('active');
  menuItems[idx].scrollIntoView({block:'nearest'});
  document.getElementById('cur').textContent = idx+1;
  document.getElementById('progress').style.width = ((idx)/(total-1)*100)+'%';
  document.getElementById('prevBtn').disabled = idx===0;
  const nb = document.getElementById('nextBtn');
  nb.innerHTML = idx===total-1 ? 'Reiniciar ↺' : 'Siguiente ▶';
}
function next(){ idx===total-1 ? go(0) : go(idx+1); }
function prev(){ go(idx-1); }

document.getElementById('nextBtn').addEventListener('click',next);
document.getElementById('prevBtn').addEventListener('click',prev);

/* teclado */
document.addEventListener('keydown',e=>{
  if(document.getElementById('overlay').classList.contains('open')){ if(e.key==='Escape') closeMenu(); return; }
  if(['ArrowRight','PageDown',' '].includes(e.key)){ e.preventDefault(); next(); }
  else if(['ArrowLeft','PageUp'].includes(e.key)){ e.preventDefault(); prev(); }
  else if(e.key==='Home'){ go(0); }
  else if(e.key==='End'){ go(total-1); }
  else if(e.key==='m'||e.key==='M'){ openMenu(); }
});

/* swipe */
let tx=0,ty=0;
deck.addEventListener('touchstart',e=>{tx=e.changedTouches[0].clientX;ty=e.changedTouches[0].clientY;},{passive:true});
deck.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.4){ dx<0 ? next() : prev(); }
},{passive:true});

/* menú */
const overlay=document.getElementById('overlay');
function openMenu(){ overlay.classList.add('open'); }
function closeMenu(){ overlay.classList.remove('open'); }
document.getElementById('menuBtn').addEventListener('click',openMenu);
document.getElementById('menuClose').addEventListener('click',closeMenu);
overlay.addEventListener('click',e=>{ if(e.target===overlay) closeMenu(); });

/* enlace en vivo */
if(LIVE_YOUTUBE_URL && LIVE_YOUTUBE_URL.trim()){
  const lb=document.getElementById('liveBtn');
  lb.href=LIVE_YOUTUBE_URL; lb.style.display='flex';
}

/* toast bienvenida */
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3200);
}

/* ---------- starfield ---------- */
(function(){
  const c=document.getElementById('stars'), x=c.getContext('2d');
  let w,h,stars;
  function size(){ w=c.width=innerWidth; h=c.height=innerHeight;
    stars=Array.from({length:Math.min(120,Math.floor(w*h/16000))},()=>({
      x:Math.random()*w,y:Math.random()*h,z:Math.random()*.8+.2,
      r:Math.random()*1.4+.3,tw:Math.random()*Math.PI*2})); }
  size(); addEventListener('resize',size);
  (function loop(t){
    x.clearRect(0,0,w,h);
    for(const s of stars){
      s.tw+=0.02;
      const a=0.35+Math.sin(s.tw)*0.35*s.z;
      x.beginPath(); x.arc(s.x,s.y,s.r,0,7); 
      x.fillStyle=`rgba(${120+Math.floor(s.z*135)},${200},255,${a})`; x.fill();
      s.y+=s.z*0.12; if(s.y>h){s.y=0;s.x=Math.random()*w;}
    }
    requestAnimationFrame(loop);
  })();
})();

go(0);
setTimeout(()=>toast('Usa ☰ Índice para saltar a cualquier fase'),700);
</script>
